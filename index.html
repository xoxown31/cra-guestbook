<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>방명록</title>
  <!-- 테마의 최종 결정자는 OS 설정이 아니라 <html data-theme> 라서,
       media 로 나눈 두 줄만으론 "OS는 라이트인데 토글로 다크"를 못 따라간다.
       media 없는 세 번째 줄을 두고 applyTheme() 이 이 값을 갱신한다. -->
  <meta name="theme-color" content="#F7F6F2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1A1917" media="(prefers-color-scheme: dark)" />
  <meta id="theme-color" name="theme-color" content="#F7F6F2" />
  <!-- 파비콘을 인라인으로. 안 넣으면 브라우저가 /favicon.ico를 찾다가 콘솔에 404를 남긴다.
       따옴표 두 개를 강조색으로 그린 마크. (이모지를 쓰면 기기마다 그림이 달라진다) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F7F6F2'/%3E%3Cpath d='M8 21V11h5v10H8zm11 0V11h5v10h-5z' fill='%23D2572B'/%3E%3C/svg%3E" />
  <!-- 본문은 IBM Plex Sans KR, 숫자·시각은 JetBrains Mono. 빌드 없이 링크 한 줄. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- 저장해 둔 테마를 "그리기 전에" 적용해야 밝은 화면이 번쩍이지 않는다.
       그래서 이 다섯 줄만 예외적으로 인라인. 나머지 테마 로직은 js/app.js에 있다. -->
  <script>
    try {
      var t = localStorage.getItem('guestbook.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* 시크릿 모드 등에서 막혀도 OS 설정을 그대로 따른다 */ }
  </script>
</head>
<body>
  <!-- 키보드 사용자가 Tab 한 번으로 본문까지 건너뛸 수 있게 -->
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <div class="wrap">
    <header class="head">
      <div class="head-row">
        <div class="head-title">
          <p class="eyebrow">CRA Study</p>
          <h1>방명록</h1>
        </div>
        <!-- 아이콘만 있는 버튼이라 aria-label이 없으면 스크린리더가 읽을 게 없다.
             아이콘은 이모지 대신 인라인 SVG 두 개. 테마에 맞는 쪽만 CSS가 보여 준다. -->
        <button id="theme-toggle" class="theme-toggle" type="button"
                aria-label="어두운 테마로 바꾸기" aria-pressed="false" title="어두운 테마로 바꾸기">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.3A8.6 8.6 0 0 1 9.7 3.5a8.6 8.6 0 1 0 10.8 10.8z" />
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2v2.3M12 19.7V22M2 12h2.3M19.7 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6" />
          </svg>
        </button>
      </div>
      <p class="sub">이름과 한 줄을 남겨 주세요. 모두가 볼 수 있어요.</p>
    </header>

    <main id="main">
      <!-- Supabase 설정이 없거나 연결이 안 될 때만 보이는 안내 띠 -->
      <p id="banner" class="banner" role="status" hidden></p>

      <form id="form" class="card" autocomplete="off" aria-labelledby="form-title">
        <h2 id="form-title" class="visually-hidden">글 남기기</h2>

        <div class="field">
          <label for="name">이름</label>
          <input id="name" name="name" type="text" maxlength="20" placeholder="홍길동"
                 required aria-describedby="name-hint" />
          <span id="name-hint" class="count"><span id="name-count">0</span>/20자</span>
        </div>

        <div class="field">
          <label for="message">한 줄</label>
          <input id="message" name="message" type="text" maxlength="100" placeholder="안녕하세요!"
                 required aria-describedby="msg-hint" />
          <span id="msg-hint" class="count"><span id="msg-count">0</span>/100자</span>
        </div>

        <button id="submit" type="submit">남기기</button>
        <!-- 검증 실패/성공 문구는 바로 읽어 줘야 하니 role="alert" -->
        <p id="form-msg" class="form-msg" role="alert" hidden></p>
      </form>

      <section class="list-area" aria-labelledby="list-title">
        <h2 id="list-title">남겨진 글 <span id="total" class="total"></span></h2>

        <!-- 검색: 이름이나 내용에 그 글자가 든 항목만 남긴다 -->
        <div class="search">
          <label for="q">검색</label>
          <input id="q" type="search" placeholder="이름이나 내용으로 검색"
                 autocomplete="off" aria-describedby="live" />
        </div>

        <p id="status" class="status">불러오는 중…</p>
        <ul id="list" class="list"></ul>

        <!-- 목록은 20개씩. 더 있을 때만 이 버튼이 보인다. -->
        <button id="more" class="more" type="button" hidden>더 보기</button>

        <!-- 목록이 바뀐 걸 스크린리더에 알리는 전용 영역 (눈에는 안 보임) -->
        <p id="live" class="visually-hidden" aria-live="polite" role="status"></p>
      </section>
    </main>

    <footer class="foot">CRA 스터디 · HTML/CSS/JS + Supabase</footer>
  </div>

  <!-- supabase-js v2 (CDN). 빌드 도구 없이 script 태그 하나로 끝. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <!-- 이 페이지는 main 에 push 되면 Netlify가 자동으로 다시 올립니다. (설정: netlify.toml) -->
</body>
</html>
